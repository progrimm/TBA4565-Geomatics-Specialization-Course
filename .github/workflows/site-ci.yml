name: Homepage CI

on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'package.json', '.github/workflows/site-ci.yml']
  pull_request:
    paths: ['site/**', 'scripts/**', 'package.json', '.github/workflows/site-ci.yml']

defaults:
  run:
    working-directory: site

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
