# Overlay for a fresh-volume replay next to the running stack.
# Use with a separate project name so Compose creates a new, empty volume:
#   docker compose -p projection-replay --env-file "Project 1/.env" \
#     -f "Project 1/compose.yaml" -f "Project 1/compose.replay.yaml" ...
# Only the published host ports change; services, images and data are the same.
services:
  db:
    ports: !override
      - "127.0.0.1:5434:5432"
  api:
    ports: !override
      - "127.0.0.1:8001:8000"
  web:
    ports: !override
      - "127.0.0.1:8081:80"
